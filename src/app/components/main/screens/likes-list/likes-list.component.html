<div class="container">
  <div class="row mt-3">
    <div class="col-lg-12 col-md-12 col-sm-12">
      <h2>{{ getTitle() }}</h2>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col btn-group">
      <button
        class="btn btn-primary"
        btnRadio="liked"
        [(ngModel)]="predicate"
        (click)="loadLikes()"
      >
        Member I Like
      </button>
    </div>

    <div class="col btn-group">
      <button
        class="btn btn-primary"
        btnRadio="likedBy"
        [(ngModel)]="predicate"
        (click)="loadLikes()"
      >
        Member Who Like Me
      </button>
    </div>

    <div class="col btn-group">
      <button
        class="btn btn-primary"
        btnRadio="mutual"
        [(ngModel)]="predicate"
        (click)="loadLikes()"
      >
        Mutual
      </button>
    </div>

    <div class="row mt-3">
      @for (member of likeService.paginatedResult()?.items; track member.id) {
      <div class="col-2">
        <app-card [userData]="member"></app-card>
      </div>
      }
    </div>
  </div>

  @if (likeService.paginatedResult()?.pagination) {
  <div class="row">
    <div
      class="col-lg-12 col-md-12 col-sm-12 d-flex justify-content-center my-5"
    >
      <pagination
        [boundaryLinks]="true"
        [totalItems]="(likeService.paginatedResult()?.pagination)!.totalItems"
        [itemsPerPage]="
          (likeService.paginatedResult()?.pagination)!.itemsPerPage
        "
        (pageChanged)="pageChanged($event)"
        [maxSize]="10"
        [(ngModel)]="(likeService.paginatedResult()?.pagination)!.currentPage"
        previousText="&lsaquo;"
        nextText="&rsaquo;"
        firstText="&laquo;"
        lastText="&raquo;"
      >
      </pagination>
    </div>
  </div>
  }
</div>
